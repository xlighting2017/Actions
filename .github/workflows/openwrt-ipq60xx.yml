name: Build ipq60xx with ECM

on:
  repository_dispatch:
    types: [Source_Code_Update_laipeng668, Source_Code_Update_VIKINGYFY]
  workflow_dispatch:
  #  schedule:
  #    - cron: 11 22 * * 5
    inputs:
        url:
          description: 'Select REPO URL'
          required: false
          default: "https://github.com/VIKINGYFY/immortalwrt"
          type: choice
          options: 
            - "https://github.com/VIKINGYFY/immortalwrt"
            - "https://github.com/laipeng668/immortalwrt"
            - "https://github.com/laipeng668/LibWrt"
        branch:
          description: "Select REPO Branch"
          required: false
          default: "main"
          type: choice
          options:
            - "main"
            - "openwrt-25.12"
            - "25.12-nss"


env:
  REPO_URL: https://github.com/laipeng668/immortalwrt
  REPO_BRANCH: master
  TARGET_NAME: ipq60xx
  FEEDS_CONF: ipq60xx/feeds.conf
  CONFIG_FILE: ipq60xx/.config
  DIY_P1_SH: ipq60xx/diy-part1.sh
  DIY_P2_SH: ipq60xx/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  FREE_DISK_SPACE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:      
    - name: Setup Env (on repository_dispatch)
      if:  github.event_name == 'repository_dispatch'
      run: |
        # decide REPO/BRANCH based on dispatch event
        echo "REPO_URL=${{ github.event.client_payload.repo.url }}" >> "$GITHUB_ENV"
        echo "REPO_BRANCH=${{ github.event.client_payload.repo.branch }}" >> "$GITHUB_ENV"
    
    - name: Setup Env (on workflow_dispatch)
      if:  github.event_name == 'workflow_dispatch'
      run: |
        echo "REPO_URL=${{ github.event.inputs.url }}" >> "$GITHUB_ENV"
        echo "REPO_BRANCH=${{ github.event.inputs.branch }}" >> "$GITHUB_ENV"

    - name: Checkout
      uses: actions/checkout@main

    - name: Free Disk Space (Ubuntu)
      if: env.FREE_DISK_SPACE == 'true' && (!cancelled())
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /mnt/workdir
        sudo chown $USER:$GROUPS /mnt/workdir

    - name: Clone source code
      working-directory: /mnt/workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ccache hashes neither the assembler nor cc1, so the key covers every
    # toolchain input and a change there starts from an empty cache. GitHub
    # drops entries unused for 7 days and evicts the oldest over the quota.
    # The GCC version string carries the OpenWrt revision, which lands in
    # the compiler binary and the kernel's autoconf.h and so misses every
    # target object on each new commit; the toolchain tree hash replaces it.
    - name: Compute ccache key
      id: ccache
      run: |
        set -euo pipefail
        tree=$(git -C openwrt rev-parse HEAD:toolchain)
        mk=openwrt/toolchain/gcc/common.mk
        # shellcheck disable=SC2016 # make variables, not shell
        grep -qx 'PKGVERSION=OpenWrt GCC $(PKG_VERSION) $(REVISION)' "$mk"
        sed -i "s/^PKGVERSION=.*/PKGVERSION=OpenWrt GCC \$(PKG_VERSION) ${tree:0:12}/" "$mk"
        sum=$({
          echo "$tree"
          grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' openwrt/.config
          gcc --version; as --version
        } | sha256sum | cut -c1-16)
        echo "prefix=ccache-${{ env.TARGET_NAME }}-$sum-" >>"$GITHUB_OUTPUT"

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: openwrt/.ccache
        key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.ccache.outputs.prefix }}

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e ipq60xx/files ] && mv ipq60xx/files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        grep '^CONFIG_TARGET_DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | awk -v d=" / " '{s=(NR==1?s:s d)$0}END{print s}' > DEVICE_NAME
        echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        grep '^CONFIG_TARGET_PREINIT_IP=' .config | sed -r 's/.*PREINIT_IP="(.*)"/\1/' > DEVICE_IP
        echo "DEVICE_IP=$(cat DEVICE_IP)" >> $GITHUB_ENV
        grep '^CONFIG_PACKAGE_luci-app.*=y' .config | sed -r 's/.*luci-app-(.*)=y/- \1/' | grep -v "[IU]" | sort | uniq > DEVICE_PACKAGES
        echo "DEVICE_PACKAGES<<EOF" >> $GITHUB_ENV
        echo "$(cat DEVICE_PACKAGES)" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      env:
        CCACHE_COMPILERCHECK: content
        CCACHE_MAXSIZE: 4G
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "FILE_DATE=$(date +"%y.%m.%d")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        staging_dir/host/bin/ccache -s

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory as Artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.TARGET_NAME }}_${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory as Artifacts
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.TARGET_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=Openwrt_${{ env.TARGET_NAME }}_v${{ env.FILE_DATE }}" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      id: upload
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body: |
          Repo: ${{ env.REPO_URL }}
          Branch: ${{ env.REPO_BRANCH }}
          Target: ${{ env.TARGET_NAME }}
          Device(s): ${{ env.DEVICE_NAME }}
          Default IP: ${{ env.DEVICE_IP }}
          Default password: NULL
          Luci App installed:
            ${{ env.DEVICE_PACKAGES }}
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        delete_workflow_pattern: ${{ env.TARGET_NAME }}
        retain_days: 3
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && steps.upload.outputs.id != '' && !cancelled()
      with:
        keep_latest: 2
        delete_tags: true
        delete_tag_pattern: Openwrt_${{ env.TARGET_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
