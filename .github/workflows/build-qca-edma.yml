name: Build QCA EDMA-NSS

on:
  # repository_dispatch:
  #   types: [Source_Code_Update_JuliusBairaktaris]
  workflow_dispatch:
  #  schedule:
  #    - cron: 11 22 * * 5
    inputs:
      device:
        description: 'Device(s) for build action, can be something like "ipq807x,ipq60xx"'
        required: false
        default: 'all'
        type: choice
        options: 
          - all
          - ipq807x
          - ipq60xx

env:
  REPO_URL: JuliusBairaktaris/openwrt-ppe-nss
  REPO_BRANCH: nss-edma-rework-vendor-archive
  VARIANT: edma-nss
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  FREE_DISK_SPACE: false
  TZ: Asia/Shanghai
  FEEDS: |
    src-git nss https://github.com/JuliusBairaktaris/nss-packages.git;edma-nss

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      deviceList: ${{ steps.generate-matrix.outputs.device }}
      variant: ${{ env.VARIANT }}
    steps:      
      - name: Setup Env (on repository_dispatch)
        if:  github.event_name == 'repository_dispatch'
        run: |
          echo "device_input=all" >> "$GITHUB_ENV"
      
      - name: Setup Env (on workflow_dispatch)
        if:  github.event_name == 'workflow_dispatch'
        run: |
          echo "device_input=${{ github.event.inputs.device }}" >> "$GITHUB_ENV"

      - id: generate-matrix
        run: |
          case ${{ env.device_input }} in
            "all")
              echo "device=$(echo '"ipq807x,ipq60xx"' | jq -c '. | split(",") | map(if type=="string" then gsub("^\\s+|\\s+$";"") else . end)')" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "device=$(echo '"${{ env.target }}"' | jq -c '. | split(",") | map(if type=="string" then gsub("^\\s+|\\s+$";"") else . end)')" >> $GITHUB_OUTPUT
              ;;
          esac

  build:
    name: Build ${{ matrix.device }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        device: ${{fromJSON(needs.prepare.outputs.deviceList)}}
        variant: [${{needs.prepare.outputs.variant}}]
    env:
      GH_TOKEN: ${{ github.token }}
      COMMON: common.${{ matrix.variant }}
      DEVICE: ${{ matrix.device }}.${{ matrix.variant }}

    steps:
    - name: Free Disk Space (Ubuntu)
      if: env.FREE_DISK_SPACE == 'true' && (!cancelled())
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo bash -c 'bash <(curl -s https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo timedatectl set-timezone "$TZ"
        df -hT $PWD

    - name: Checkout OpenWrt source
      uses: actions/checkout@main
      with:
        repository: ${{ env.REPO_URL }}
        ref: ${{ env.REPO_BRANCH }}
        fetch-depth: 0
        path: openwrt
    
    - name: Checkout builder repo
      uses: actions/checkout@main
      with:
        path: builder

    - name: Prepare build environment
      env:
        OPENWRT_DIR: ${{ github.workspace }}/openwrt
        BUILDER_REPO: ${{ github.workspace }}/builder
      run: |
        bash builder/scripts/prepare-build.sh
        cd ${{ env.OPENWRT_DIR }}
        grep '^CONFIG_TARGET_DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' | awk -v d=" / " '{s=(NR==1?s:s d)$0}END{print s}' > DEVICE_NAME
        echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        grep '^CONFIG_TARGET_PREINIT_IP=' .config | sed -r 's/.*PREINIT_IP="(.*)"/\1/' > DEVICE_IP
        echo "DEVICE_IP=$(cat DEVICE_IP)" >> $GITHUB_ENV
        grep '^CONFIG_PACKAGE_luci-app.*=y' .config | sed -r 's/.*luci-app-(.*)=y/- \1/' | grep -v "[IU]" | sort | uniq > DEVICE_PACKAGES
        echo "DEVICE_PACKAGES<<EOF" >> $GITHUB_ENV
        echo "$(cat DEVICE_PACKAGES)" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    # The OpenWrt source mirrors can stall, and a git source
    # cannot fall back to a fresh clone: its PKG_MIRROR_HASH covers the zstd
    # stream, which changes with the zstd version. Verified downloads are kept
    # between runs; download.pl deletes any that no longer match their hash.
    # Old source versions accumulate; deleting the dl- entries starts over.
    - name: Restore sources
      uses: actions/cache/restore@v6
      with:
        path: openwrt/dl
        key: dl-${{ github.run_id }}
        restore-keys: dl-

    - name: Download sources
      id: download
      working-directory: openwrt
      run: |
        set -euo pipefail
        mkdir -p dl
        before=$(find dl -maxdepth 1 -type f | wc -l)
        for attempt in 1 2 3; do
          make download -j"$(nproc)" V=s && break
          echo "Download attempt $attempt failed; retrying..."
          sleep 5
        done
        echo "grew=$(($(find dl -maxdepth 1 -type f | wc -l) > before))" >>"$GITHUB_OUTPUT"

    # One entry per run that fetched something new: the first job to get here
    # saves, the others find the key taken. Each job restores the newest
    # entry, so it grows to the union of every group's sources.
    - name: Save sources
      if: steps.download.outputs.grew == 1
      uses: actions/cache/save@v6
      with:
        path: openwrt/dl
        key: dl-${{ github.run_id }}

    # ccache hashes neither the assembler nor cc1, so the key covers every
    # toolchain input and a change there starts from an empty cache. GitHub
    # drops entries unused for 7 days and evicts the oldest over the quota.
    - name: Compute ccache key
      id: ccache
      run: |
        set -euo pipefail
        tree=$(git -C openwrt rev-parse HEAD:toolchain)
        sum=$({
          echo "$tree"
          grep -E '^CONFIG_(BINUTILS|GCC|LIBC|MUSL|GLIBC)_' openwrt/.config
          gcc --version; as --version
        } | sha256sum | cut -c1-16)
        echo "prefix=ccache-${{ env.DEVICE }}-$sum-" >>"$GITHUB_OUTPUT"

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: openwrt/.ccache
        key: ${{ steps.ccache.outputs.prefix }}${{ github.run_id }}
        restore-keys: ${{ steps.ccache.outputs.prefix }}

    - name: Compile the firmware
      id: compile
      env:
        CCACHE_COMPILERCHECK: content
        CCACHE_MAXSIZE: 4G
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "FILE_DATE=$(date +"%y.%m.%d")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT
        staging_dir/host/bin/ccache -s

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory as Artifacts
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ env.DEVICE }}_${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory as Artifacts
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ env.DEVICE }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=Openwrt_${{ env.DEVICE }}_v${{ env.FILE_DATE }}" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      id: upload
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body: |
          Repo: ${{ env.REPO_URL }}
          Branch: ${{ env.REPO_BRANCH }}
          Target: ${{ matrix.TARGET_NAME }}
          Device(s): ${{ env.DEVICE_NAME }}
          Default IP: ${{ env.DEVICE_IP }}
          Default password: NULL
          Luci App installed:
            ${{ env.DEVICE_PACKAGES }}
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        delete_workflow_pattern: prepare-build
        retain_days: 3
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && steps.upload.outputs.id != '' && !cancelled()
      with:
        keep_latest: 2
        delete_tags: true
        delete_tag_pattern: ${{ env.DEVICE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}